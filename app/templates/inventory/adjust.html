{% extends 'base.html' %}{% block title %}Adjust stock · StockFlow{% endblock %}{% block content %}<h2>Adjust stock — {{ product.name }}</h2><p>Current stock: <strong>{{ product.stock_quantity }}</strong></p><form method="post" class="card shadow-sm p-4" style="max-width:600px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">New stock quantity</label><input name="target" type="number" class="form-control mb-3" value="{{ product.stock_quantity }}" min="0" max="1000000000" required><label class="form-label">Reason</label><textarea name="reason" class="form-control mb-3" required minlength="3" maxlength="255" placeholder="Physical count, damage, correction..."></textarea><button type="submit" class="btn btn-primary">Save adjustment</button></form>{% endblock %}
