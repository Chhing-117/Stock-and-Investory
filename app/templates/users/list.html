{% extends 'base.html' %}{% block title %}Users — StockFlow{% endblock %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="fw-bold">Users</h1><a class="btn btn-primary" href="{{url_for('users.new')}}">Add user</a></div><div class="card shadow-sm border-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>{% for user in users %}<tr><td>{{user.username}}</td><td>{{user.role}}</td><td>{{'Active' if user.active else 'Disabled'}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('users.edit',user_id=user.id)}}">Edit</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
